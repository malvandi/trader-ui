<div class="fetch-codal-data-container">
  <h2>Fetch Codal Data</h2>

  <div class="input-group">
    <mat-form-field>
      <mat-label>URL</mat-label>
      <input
        matInput
        type="text"
        id="url"
        [(ngModel)]="url"
        (ngModelChange)="onUrlChange()"
        placeholder="Enter URL"
        [disabled]="isProcessing"
      />
    </mat-form-field>

    <mat-form-field>
      <mat-label>از صفحه</mat-label>
      <input
        matInput
        type="number"
        id="fromPage"
        [(ngModel)]="fromPage"
        (ngModelChange)="onFromPageChange()"
        min="1"
        [disabled]="isProcessing"
      />
    </mat-form-field>

    <mat-form-field>
      <mat-label>تا صفحه</mat-label>
      <input
        matInput
        type="number"
        id="toPage"
        [(ngModel)]="toPage"
        (ngModelChange)="onToPageChange()"
        min="1"
        [disabled]="isProcessing"
      />
    </mat-form-field>

    <mat-form-field>
      <mat-label>تعداد ترد</mat-label>
      <input
        matInput
        type="number"
        id="threads"
        [(ngModel)]="threads"
        (ngModelChange)="onThreadsChange()"
        min="1"
        [disabled]="isProcessing"
      />
    </mat-form-field>

    <button
      mat-raised-button
      [color]="isPaused ? 'accent' : 'primary'"
      (click)="generateUrls()"
      class="generate-button"
    >
      <ng-container *ngIf="!isProcessing && !isProcessingDataList">
        دریافت اطلاعیه ها
      </ng-container>
      <ng-container *ngIf="(isProcessing || isProcessingDataList) && !isPaused">
        توقف دانلود
      </ng-container>
      <ng-container *ngIf="(isProcessing || isProcessingDataList) && isPaused">
        دانلود متوقف شده
      </ng-container>
    </button>
  </div>

  <div class="buttons-container" *ngIf="urlEntries.length > 0">
    <h3>Page Buttons</h3>
    <div class="buttons-grid">
      <button
        *ngFor="let entry of urlEntries"
        mat-raised-button
        [class]="'status-' + entry.status"
        [disabled]="entry.status === 'in_process' && !isPaused"
        (click)="fetchUrlData(entry)"
        class="page-button"
      >
        {{ entry.pageNumber }}
      </button>
    </div>
  </div>

  <div class="progress-container" *ngIf="dataList.length > 0">
    <h3>وضعیت دانلود کدال</h3>

    <mat-progress-bar
      mode="determinate"
      [value]="progressPercent">
    </mat-progress-bar>

    <div class="progress-stats">
      <div class="stat-item success">
        <span class="label">موفق</span>
        <span class="value">{{ successCount }}</span>
      </div>
      <div class="stat-item error">
        <span class="label">خطا</span>
        <span class="value">{{ errorCount }}</span>
      </div>
      <div class="stat-item queue">
        <span class="label">در صف</span>
        <span class="value">{{ inQueueCount }}</span>
      </div>
      <div class="stat-item total">
        <span class="label">مجموع</span>
        <span class="value">{{ totalCodalItems }}</span>
      </div>
    </div>
  </div>

  <div *ngIf="urlEntries.length === 0 && dataList.length === 0" class="empty-state">
    Enter URL and page range, then click "Generate URLs" to start.
  </div>
</div>
